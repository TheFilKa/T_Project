project:
  seed: 72
  experiment_name: "baseline_rdkit_descriptors"
  n_jobs: -1

paths:
  train_csv: "data/raw/train.csv"
  test_csv: "data/raw/test.csv"
  sample_submission_csv: "data/raw/sample_submission.csv"
  processed_dir: "data/processed"
  models_dir: "models"
  submissions_dir: "data/submissions"

data:
  id_col: "index"
  target_cols: ["IC50, mM", "CC50, mM", "SI"]
  submission_target_cols: ["IC50", "CC50", "SI"]
  smiles_col: null
  drop_cols: ["index"]

features:
  use_existing_numeric: true
  use_smiles_basic: false
  use_rdkit_descriptors: false
  use_morgan_fp: false
  morgan_radius: 2
  morgan_n_bits: 2048
  cache_features: true
  remove_constant_features: true
  missing_strategy: "median"

validation:
  scheme: "kfold"
  n_splits: 5
  target_for_bins: "IC50, mM"
  n_bins: 10
  group_col: null

training:
  model_name: "random_forest"
  target_transform: "none"
  si_strategy: "ratio"          # direct | ratio | blend
  ic50_floor_for_si: 1.0e-9
  si_blend_alpha: 0.45           # used only when si_strategy="blend"
  save_oof: true
  clip_predictions_to_nonnegative: true

models:
  ridge:
    alpha: 10.0
  random_forest:
    n_estimators: 1000
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 2
    max_features: 0.75
    bootstrap: true
    random_state: 72
    n_jobs: -1
  extratrees:
    n_estimators: 800
    max_depth: null
    min_samples_leaf: 1
    max_features: 0.7
    random_state: 72
    n_jobs: -1
  histgb:
    learning_rate: 0.04
    max_iter: 500
    l2_regularization: 0.05
    random_state: 72
  lightgbm:
    n_estimators: 3000
    learning_rate: 0.02
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 72
    n_jobs: -1
  catboost:
    iterations: 3000
    learning_rate: 0.03
    depth: 6
    loss_function: "RMSE"
    random_seed: 72
    verbose: false
  xgboost:
    n_estimators: 2500
    learning_rate: 0.02
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 2.0
    random_state: 72
    n_jobs: -1
